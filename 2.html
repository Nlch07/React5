<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание №2: Метод Брауна-Робинсон (Дроби)</title>
    <style>
        body { font-family: 'Times New Roman', serif; background: #fff; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        h2 { text-align: center; text-transform: uppercase; }
        h3{color:red;}
        .controls { background: #f2f2f2; padding: 15px; border: 1px solid #ccc; margin-bottom: 20px; }
        
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid black; padding: 5px; text-align: center; font-size: 14px; }
        th { background: #e0e0e0; }
        
        .matrix-table { width: auto; margin-bottom: 20px; }
        .matrix-table input { width: 40px; text-align: center; }
        
        .results-box { margin-top: 20px; border: 1px solid black; padding: 10px; font-weight: bold; }
        button { cursor: pointer; padding: 5px 15px; margin: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Задание №2: Метод Брауна-Робинсон (Дроби)</h2>
    <h3>Халакоев А ПОСВТиАС 3 группа</h3>
    
    <div class="controls">
        Строк: <input type="number" id="rows" value="3">
        Столбцов: <input type="number" id="cols" value="4">
        Итераций: <input type="number" id="iters" value="10">
        <button onclick="buildInputTable()">Создать матрицу</button>
    </div>

    <div id="matrixArea"></div>
    <div id="tableOutput"></div>
    <div id="finalMetrics"></div>
</div>

<script>
    // Функция для получения дроби из десятичного числа
    function toFraction(num, denominator) {
        if (num === 0) return "0";
        const gcd = (a, b) => b ? gcd(b, a % b) : a;
        const common = Math.abs(gcd(num, denominator));
        const numerator = num / common;
        const den = denominator / common;
        return den === 1 ? `${numerator}` : `${numerator}/${den}`;
    }

    function buildInputTable() {
        const r = parseInt(document.getElementById('rows').value);
        const c = parseInt(document.getElementById('cols').value);
        let html = '<table>';
        const def = [[8,4,10,6],[9,5,11,7],[7,3,9,5]];
        for (let i = 0; i < r; i++) {
            html += '<tr>';
            for (let j = 0; j < c; j++) {
                let val = (def[i] && def[i][j]) ? def[i][j] : 0;
                html += `<td><input type="number" id="m_${i}_${j}" value="${val}"></td>`;
            }
            html += '</tr>';
        }
        html += '</table><button onclick="runCalculation()">Рассчитать</button>';
        document.getElementById('matrixArea').innerHTML = html;
    }

    function runCalculation() {
        const rows = parseInt(document.getElementById('rows').value);
        const cols = parseInt(document.getElementById('cols').value);
        const N = parseInt(document.getElementById('iters').value);
        
        let A = [];
        for (let i = 0; i < rows; i++) {
            let rData = [];
            for (let j = 0; j < cols; j++) {
                rData.push(parseFloat(document.getElementById(`m_${i}_${j}`).value) || 0);
            }
            A.push(rData);
        }

        let p_counts = new Array(rows).fill(0);
        let q_counts = new Array(cols).fill(0);
        let x_accum = new Array(cols).fill(0); 
        let y_accum = new Array(rows).fill(0); 
        
        let tableHtml = `<table><thead><tr>
            <th rowspan="2">k</th><th rowspan="2">i</th>
            <th colspan="${cols}">Выигрыш А</th><th rowspan="2">j</th>
            <th colspan="${rows}">Проигрыш B</th>
            <th colspan="3">Цена игры</th></tr><tr>`;
        
        for(let j=1; j<=cols; j++) tableHtml += `<th>x<sub>${j}</sub></th>`;
        for(let i=1; i<=rows; i++) tableHtml += `<th>y<sub>${i}</sub></th>`;
        tableHtml += `<th><u>v</u><sub>k</sub></th><th>v&OverBar;<sub>k</sub></th><th>v<sub>cp</sub></th></tr></thead><tbody>`;

        let current_i = 0; 
        let logText = "";

        for (let k = 1; k <= N; k++) {
            p_counts[current_i]++;
            for (let j = 0; j < cols; j++) x_accum[j] += A[current_i][j];
            
            let minX = Math.min(...x_accum);
            let current_j = x_accum.indexOf(minX);
            q_counts[current_j]++;
            
            for (let i = 0; i < rows; i++) y_accum[i] += A[i][current_j];
            let maxY = Math.max(...y_accum);

            // Формируем значения в виде дробей
            let v_low = toFraction(minX, k);
            let v_high = toFraction(maxY, k);
            let v_cp = toFraction(minX + maxY, 2 * k);

            tableHtml += `<tr>
                <td>${k}</td><td>${current_i+1}</td>
                ${x_accum.map(v => `<td>${v}</td>`).join('')}
                <td>${current_j+1}</td>
                ${y_accum.map(v => `<td>${v}</td>`).join('')}
                <td>${v_low}</td><td>${v_high}</td><td>${v_cp}</td>
            </tr>`;

            logText += `${k}\t${current_i+1}\t${x_accum.join("\t")}\t${current_j+1}\t${y_accum.join("\t")}\t${v_low}\t${v_high}\t${v_cp}\n`;
            
            current_i = y_accum.indexOf(maxY);
        }

        tableHtml += '</tbody></table>';
        tableHtml += `<button onclick="downloadFile(\`${logText}\`)">Сохранить в файл</button>`;
        document.getElementById('tableOutput').innerHTML = tableHtml;

        let p_strat = p_counts.map(c => toFraction(c, N));
        let q_strat = q_counts.map(c => toFraction(c, N));

        document.getElementById('finalMetrics').innerHTML = `
            <div class="results-box">
                Ожидаемая цена игры V ≈ ${toFraction(Math.min(...x_accum) + Math.max(...y_accum), 2 * N)}<br>
                Стратегии игрока А: P = (${p_strat.join('; ')})<br>
                Стратегии игрока B: Q = (${q_strat.join('; ')})
            </div>`;
    }

    function downloadFile(text) {
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'solution.txt';
        a.click();
    }

    buildInputTable();
</script>

</body>
</html>
