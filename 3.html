<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание №3</title>
    <style>
        body { font-family: 'Times New Roman', serif; background: #fff; padding: 20px; color: #000; }
        .container { max-width: 1100px; margin: auto; }
        h2 { text-align: center; text-transform: uppercase; border-bottom: 2px solid #000; padding-bottom: 10px; }
        h3{color:red;}
        .box { border: 1px solid #000; padding: 15px; margin-bottom: 20px; background: #f9f9f9; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
        th { background: #f0f0f0; }
        input[type="number"] { width: 65px; border: 1px solid #000; text-align: center; font-family: 'Times New Roman', serif; }
        button { background: #fff; border: 1px solid #000; padding: 8px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #eee; }
        .optimal { background-color: #d4edda !important; border: 2px solid #28a745 !important; font-weight: bold; }
        .result-section { margin-top: 30px; }
        h3 { border-left: 5px solid #000; padding-left: 10px; margin-top: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Статистические игры: Принятие решений в условиях неопределенности</h2>
    <h3>Халакоев А ПОСВТиАС 3 группа</h3>
    
    <div class="box">
        <strong>1. Настройка размерности:</strong> <br><br>
        Строк (Стратегии A): <input type="number" id="rows" value="3">
        Столбцов (Состояния П): <input type="number" id="cols" value="3">
        <button onclick="buildMatrix()">Создать таблицу ввода</button>
        <div style="margin-top: 15px; border-top: 1px solid #000; padding-top: 10px;">
            <button onclick="saveToFileJson()">Сохранить JSON</button>
            <label style="margin-left: 10px;">Загрузить JSON:</label>
            <input type="file" onchange="loadFromFileJson(event)" accept=".json">
        </div>
    </div>

    <div id="inputArea"></div>

    <div id="criteriaSelect" class="box" style="display:none;">
        <strong>2. Выбор критериев и параметров:</strong><br><br>
        <label><input type="checkbox" id="checkBayes" checked> Критерии Байеса и Лапласа</label><br>
        <label><input type="checkbox" id="checkWald" checked> Критерий Вальда (Максимин)</label><br>
        <label><input type="checkbox" id="checkSavage" checked> Критерий Сэвиджа (Минимаксный риск)</label><br>
        <label><input type="checkbox" id="checkHurwitz" checked> Критерий Гурвица</label> 
        (Коэф. &gamma;: <input type="number" id="h_gamma" value="0.5" step="0.1" min="0" max="1">)
        <br><br>
        <button onclick="calculateAll()">Рассчитать и вывести таблицы</button>
        <button onclick="saveResultToFile()">Сохранить результат в файл</button>
    </div>

    <div id="outputArea" class="result-section"></div>
</div>

<script>
    function rawFraction(num, den) {
        return (num % den === 0) ? (num / den).toString() : num + "/" + den;
    }

    function buildMatrix() {
        const r = parseInt(document.getElementById('rows').value);
        const c = parseInt(document.getElementById('cols').value);
        let html = '<h3>Матрица выигрышей и вероятностей</h3><table><thead><tr><th></th>';
        for(let j=1; j<=c; j++) html += `<th>П<sub>${j}</sub></th>`;
        html += '</tr></thead><tbody>';
        for(let i=1; i<=r; i++) {
            html += `<tr><th>A<sub>${i}</sub></th>`;
            for(let j=1; j<=c; j++) html += `<td><input type="number" class="cell" data-r="${i-1}" data-c="${j-1}" value="0"></td>`;
            html += '</tr>';
        }
        html += `<tr><th>Вероятности P<sub>j</sub></th>`;
        for(let j=0; j<c; j++) html += `<td><input type="number" class="prob" data-c="${j}" value="1"> / <input type="number" class="prob-den" id="pden_${j}" value="${c}"></td>`;
        html += '</tr></tbody></table>';
        document.getElementById('inputArea').innerHTML = html;
        document.getElementById('criteriaSelect').style.display = 'block';
    }

    function saveToFileJson() {
        const rows = parseInt(document.getElementById('rows').value);
        const cols = parseInt(document.getElementById('cols').value);
        let matrix = [];
        document.querySelectorAll('.cell').forEach(c => {
            if(!matrix[c.dataset.r]) matrix[c.dataset.r] = [];
            matrix[c.dataset.r][c.dataset.c] = c.value;
        });
        let probs = [];
        document.querySelectorAll('.prob').forEach((p, idx) => {
            probs.push({ num: p.value, den: document.getElementById('pden_' + idx).value });
        });
        const data = { rows, cols, matrix, probs };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'data.json';
        a.click();
    }

    function loadFromFileJson(event) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const d = JSON.parse(e.target.result);
            document.getElementById('rows').value = d.rows;
            document.getElementById('cols').value = d.cols;
            buildMatrix();
            document.querySelectorAll('.cell').forEach(c => c.value = d.matrix[c.dataset.r][c.dataset.c]);
            document.querySelectorAll('.prob').forEach((p, idx) => {
                p.value = d.probs[idx].num;
                document.getElementById('pden_' + idx).value = d.probs[idx].den;
            });
        };
        reader.readAsText(event.target.files[0]);
    }

    function calculateAll() {
        const rows = parseInt(document.getElementById('rows').value);
        const cols = parseInt(document.getElementById('cols').value);
        let A = Array.from({length: rows}, () => new Array(cols).fill(0));
        document.querySelectorAll('.cell').forEach(c => A[c.dataset.r][c.dataset.c] = parseFloat(c.value) || 0);
        let pNum = Array.from(document.querySelectorAll('.prob')).map(i => parseFloat(i.value) || 0);
        let pDen = Array.from(document.querySelectorAll('.prob-den')).map(i => parseFloat(i.value) || 1);
        let out = document.getElementById('outputArea'); out.innerHTML = '';

        if(document.getElementById('checkBayes').checked) {
            let commonDen = pDen.reduce((a, b) => a * b, 1);
            let bayesScores = A.map(row => rawFraction(row.reduce((acc, val, j) => acc + val * pNum[j] * (commonDen / pDen[j]), 0), commonDen));
            let laplaceScores = A.map(row => rawFraction(row.reduce((a, b) => a + b, 0), cols));
            renderTable("Критерии Байеса и Лапласа", ["B", "L"], [bayesScores, laplaceScores], A);
        }
        if(document.getElementById('checkWald').checked || document.getElementById('checkHurwitz').checked) {
            let wald = A.map(row => Math.min(...row));
            let gamma = parseFloat(document.getElementById('h_gamma').value);
            let hurwitz = A.map(row => (gamma * Math.min(...row) + (1 - gamma) * Math.max(...row)).toFixed(2));
            let names = [], data = [];
            if(document.getElementById('checkWald').checked) { names.push("W"); data.push(wald); }
            if(document.getElementById('checkHurwitz').checked) { names.push("H"); data.push(hurwitz); }
            renderTable("Критерии Вальда и Гурвица", names, data, A);
        }
        if(document.getElementById('checkSavage').checked) {
            let colMaxs = A[0].map((_, j) => Math.max(...A.map(row => row[j])));
            let R = A.map(row => row.map((val, j) => colMaxs[j] - val));
            renderTable("Критерий Сэвиджа", ["S"], [R.map(row => Math.max(...row))], R);
        }
    }

    function renderTable(title, colNames, scores, matrix) {
        let html = `<h3>${title}</h3><table><thead><tr><th>Стратегия</th>`;
        for(let j=0; j<matrix[0].length; j++) html += `<th>П<sub>${j+1}</sub></th>`;
        colNames.forEach(name => html += `<th>${name}</th>`);
        html += '</tr></thead><tbody>';
        for(let i=0; i<matrix.length; i++) {
            html += `<tr><td>A<sub>${i+1}</sub></td>`;
            matrix[i].forEach(v => html += `<td>${v}</td>`);
            colNames.forEach((name, idx) => {
                let val = parseFloat(scores[idx][i]);
                let best = name.startsWith("S") ? Math.min(...scores[idx].map(parseFloat)) : Math.max(...scores[idx].map(parseFloat));
                html += `<td ${val === best ? 'class="optimal"' : ''}>${scores[idx][i]}</td>`;
            });
            html += '</tr>';
        }
        document.getElementById('outputArea').innerHTML += html + '</tbody></table>';
    }

    function saveResultToFile() {
        let content = document.getElementById('outputArea').innerText;
        if(!content) { alert("Сначала выполните расчет"); return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([content], { type: 'text/plain' }));
        a.download = 'report.txt'; a.click();
    }
</script>
</body>
</html>
